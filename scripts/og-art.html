<!doctype html>
<!-- Asset generator: open in a browser, wait for fonts, element-screenshot
     #og -> og-image.png (1200x630), #i512 -> icon-512.png, #i192 -> icon-192.png,
     #i180 -> apple-touch-icon.png -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Space Grotesk"; font-style: normal; font-weight: 400 700;
    src: url("https://fonts.gstatic.com/s/spacegrotesk/v22/V8mDoQDjQSkFtoMM3T6r8E7mPbF4C_k3HqU.woff2") format("woff2");
  }
  @font-face {
    font-family: "JetBrains Mono"; font-style: normal; font-weight: 400 700;
    src: url("https://fonts.gstatic.com/s/jetbrainsmono/v24/tDbv2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKwBNntkaToggR7BYRbKPxDcwgknk-4.woff2") format("woff2");
  }
  body { margin: 0; padding: 24px; background: #1a1c20; display: flex; flex-direction: column; gap: 24px; width: max-content; }
  .stage { flex: none; }

  /* ---- OG card 1200x630 ---- */
  #og {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #0C0E11;
    display: flex; align-items: center;
  }
  #og .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(620px 460px at 14% 20%, rgba(91, 33, 182, 0.34), transparent 68%),
      radial-gradient(540px 420px at 88% 86%, rgba(232, 185, 58, 0.10), transparent 70%);
  }
  #og .texture { position: absolute; inset: 0; opacity: 0.55; }
  #og .content {
    position: relative; display: flex; align-items: center; gap: 46px;
    padding: 0 60px; width: 100%;
  }
  #og .mark { flex: none; filter: drop-shadow(0 18px 42px rgba(91, 33, 182, 0.45)); }
  #og .copy { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  #og h1 {
    margin: 0; font-family: "Space Grotesk"; font-weight: 700;
    font-size: 88px; line-height: 1; letter-spacing: 0; color: #FFFFFF; white-space: nowrap;
  }
  #og h1 .dot { color: #E8B93A; }
  #og .strip {
    font-family: "JetBrains Mono"; font-weight: 700; font-size: 25px;
    letter-spacing: 3px; color: #F0CB6B; white-space: nowrap;
  }
  #og .sub {
    font-family: "Space Grotesk"; font-weight: 400; font-size: 25px;
    color: #8B93A3; letter-spacing: 0.4px;
  }
  #og .rule { width: 132px; height: 3px; background: linear-gradient(90deg, #5B21B6, #E8B93A); border-radius: 2px; }

  /* ---- Icon tiles ---- */
  .tile { position: relative; overflow: hidden; background: #0C0E11; }
  .tile .ring { position: absolute; inset: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B54E8"/><stop offset="0.55" stop-color="#5B21B6"/><stop offset="1" stop-color="#3B1478"/>
    </linearGradient>
    <linearGradient id="gp2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D2ED0"/><stop offset="1" stop-color="#2A0E52"/>
    </linearGradient>
    <linearGradient id="goldedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B93A"/><stop offset="1" stop-color="#8A6716"/>
    </linearGradient>
    <radialGradient id="tileglow" cx="0.3" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#4A1A96"/><stop offset="0.55" stop-color="#1B0F38"/><stop offset="1" stop-color="#0C0E11"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B54E8"/><stop offset="0.5" stop-color="#E8B93A"/><stop offset="1" stop-color="#4A1A96"/>
    </linearGradient>
    <g id="dragonhead">
      <polygon points="110,180 320,130 462,242 400,266 428,312 322,346 176,352 118,296" fill="url(#gp)"/>
      <polygon points="320,130 176,28 244,196" fill="url(#gp2)" stroke="url(#goldedge)" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="176,352 322,346 270,412 196,398" fill="url(#gp2)" stroke="url(#goldedge)" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="396,296 428,312 374,344" fill="#F0CB6B"/>
      <polygon points="306,206 364,214 344,242 294,228" fill="#F0CB6B"/>
      <polyline points="146,240 252,214 318,258" fill="none" stroke="#F0CB6B" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
      <polyline points="160,296 250,284 306,312" fill="none" stroke="#C7A8F7" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    </g>
    <g id="chevrons" fill="none" stroke-linecap="round">
      <polyline points="760,640 900,470 1040,640" stroke="#5B21B6" stroke-width="42" opacity="0.16"/>
      <polyline points="880,700 1040,510 1200,700" stroke="#E8B93A" stroke-width="26" opacity="0.10"/>
      <polyline points="1020,760 1180,570 1340,760" stroke="#8B54E8" stroke-width="18" opacity="0.12"/>
    </g>
  </defs>
</svg>

<div class="stage">
  <div id="og">
    <div class="glow"></div>
    <svg class="texture" width="1200" height="630" viewBox="0 0 1200 630"><use href="#chevrons"/></svg>
    <div class="content">
      <svg class="mark" width="320" height="320" viewBox="0 0 512 512"><use href="#dragonhead"/></svg>
      <div class="copy">
        <h1>CYBERDRAGON<span class="dot">_</span></h1>
        <div class="strip">DRAGON CON 2026 &middot; SEP 3&ndash;7 &middot; ATLANTA, GA</div>
        <div class="sub">Offline schedule &middot; hotel walk times &middot; friend sync</div>
        <div class="rule"></div>
      </div>
    </div>
  </div>
</div>

<div class="stage">
  <div id="i512" class="tile" style="width:512px;height:512px">
    <svg class="ring" width="512" height="512"><rect x="10" y="10" width="492" height="492" rx="112" fill="url(#tileglow)"/><rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="url(#ring)" stroke-width="10"/></svg>
    <svg width="512" height="512" viewBox="0 0 512 512" style="position:absolute;inset:0"><use href="#dragonhead" transform="translate(20,16) scale(0.93)"/></svg>
  </div>
</div>

<div class="stage">
  <div id="i192" class="tile" style="width:192px;height:192px">
    <svg class="ring" width="192" height="192"><rect x="4" y="4" width="184" height="184" rx="42" fill="url(#tileglow)"/><rect x="6" y="6" width="180" height="180" rx="40" fill="none" stroke="url(#ring)" stroke-width="4"/></svg>
    <svg width="192" height="192" viewBox="0 0 512 512" style="position:absolute;inset:0"><use href="#dragonhead" transform="translate(8,6) scale(0.94)"/></svg>
  </div>
</div>

<div class="stage">
  <div id="i180" class="tile" style="width:180px;height:180px">
    <svg class="ring" width="180" height="180"><rect x="4" y="4" width="172" height="172" rx="40" fill="url(#tileglow)"/><rect x="6" y="6" width="168" height="168" rx="38" fill="none" stroke="url(#ring)" stroke-width="4"/></svg>
    <svg width="180" height="180" viewBox="0 0 512 512" style="position:absolute;inset:0"><use href="#dragonhead" transform="translate(7,6) scale(0.94)"/></svg>
  </div>
</div>
</body>
</html>
